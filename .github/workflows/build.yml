name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.watchtoearn.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 18
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation "com.startapp:inapp-sdk:5.1.0"
              implementation "androidx.annotation:annotation:1.9.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdDisplayListener;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.adsbase.adlisteners.VideoListener;
          import com.startapp.sdk.ads.banner.Banner;

          public class MainActivity extends Activity {

              private WebView webView;
              private Banner bottomBanner;
              private FrameLayout root;
              private StartAppAd rewardedAd;

              // Start.io App ID
              private static final String STARTAPP_APP_ID = "208761301";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Initialize Start.io SDK
                  StartAppSDK.init(this, STARTAPP_APP_ID, false);
                  StartAppSDK.enableReturnAds(false);

                  rewardedAd = new StartAppAd(this);
                  loadRewardedAd();

                  root = new FrameLayout(this);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("whatsapp:")
                                  || url.contains("api.whatsapp.com")
                                  || url.startsWith("intent:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  return false;
                              }
                          }
                          return false;
                      }
                  });

                  webView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  webView.loadUrl("file:///android_asset/index.html");

                  int bannerHeightPx = (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          50,
                          getResources().getDisplayMetrics()
                  );

                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  );
                  webParams.bottomMargin = bannerHeightPx;
                  root.addView(webView, webParams);

                  // Load Banner
                  bottomBanner = new Banner(this);
                  FrameLayout.LayoutParams bannerParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  bannerParams.gravity = Gravity.BOTTOM;
                  root.addView(bottomBanner, bannerParams);

                  setContentView(root);
              }

              private void loadRewardedAd() {
                  if (rewardedAd != null) {
                      rewardedAd.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                          @Override
                          public void onReceiveAd(com.startapp.sdk.adsbase.Ad ad) {}

                          @Override
                          public void onFailedToReceiveAd(com.startapp.sdk.adsbase.Ad ad) {}
                      });
                  }
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (rewardedAd != null && rewardedAd.isReady()) {
                              rewardedAd.setVideoListener(new VideoListener() {
                                  @Override
                                  public void onVideoCompleted() {
                                      triggerRewardInWeb();
                                  }
                              });

                              rewardedAd.showAd(new AdDisplayListener() {
                                  @Override
                                  public void adHidden(com.startapp.sdk.adsbase.Ad ad) {
                                      loadRewardedAd();
                                  }

                                  @Override
                                  public void adDisplayed(com.startapp.sdk.adsbase.Ad ad) {}

                                  @Override
                                  public void adClicked(com.startapp.sdk.adsbase.Ad ad) {}

                                  @Override
                                  public void adNotDisplayed(com.startapp.sdk.adsbase.Ad ad) {
                                      Toast.makeText(MainActivity.this, "Ad failed to display. Retrying...", Toast.LENGTH_SHORT).show();
                                      loadRewardedAd();
                                  }
                              });
                          } else {
                              Toast.makeText(MainActivity.this, "Loading video ad... Please wait", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          StartAppAd.showAd(MainActivity.this);
                      });
                  }
              }

              private void triggerRewardInWeb() {
                  if (webView != null) {
                      webView.post(() ->
                              webView.evaluateJavascript(
                                      "if(window.adMobRewardEarned){window.adMobRewardEarned();}",
                                      null
                              )
                      );
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
          
