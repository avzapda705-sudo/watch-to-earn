name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Native Android WebView Project
        run: |
          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WatchToEarn"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.watchtoearn.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:25.5.0'
              implementation 'androidx.annotation:annotation:1.9.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-5150845800087406~5053767077" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/watchtoearn/app/MainActivity.java
          package com.watchtoearn.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import androidx.annotation.NonNull;

          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.rewarded.RewardItem;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView bannerAd;
              private RewardedAd rewardedAd;

              private static final String TEST_BANNER_ID =
                      "ca-app-pub-3940256099942544/6300978111";

              private static final String TEST_REWARDED_ID =
                      "ca-app-pub-3940256099942544/5224354917";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {
                      loadRewardedAd();
                  });

                  FrameLayout root = new FrameLayout(this);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {

                          if (url.startsWith("whatsapp:")
                                  || url.contains("api.whatsapp.com")
                                  || url.startsWith("intent:")) {

                              try {
                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_VIEW,
                                                  Uri.parse(url)
                                          );

                                  startActivity(intent);
                                  return true;

                              } catch (Exception e) {
                                  return false;
                              }
                          }

                          return false;
                      }
                  });

                  webView.addJavascriptInterface(
                          new AdBridge(),
                          "AndroidAd"
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  FrameLayout.LayoutParams webParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT
                          );

                  root.addView(webView, webParams);

                  bannerAd = new AdView(this);

                  bannerAd.setAdSize(AdSize.BANNER);
                  bannerAd.setAdUnitId(TEST_BANNER_ID);

                  AdRequest bannerRequest =
                          new AdRequest.Builder().build();

                  bannerAd.loadAd(bannerRequest);

                  FrameLayout.LayoutParams bannerParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT
                          );

                  bannerParams.gravity = Gravity.BOTTOM;

                  root.addView(bannerAd, bannerParams);

                  setContentView(root);
              }

              private void loadRewardedAd() {

                  AdRequest adRequest =
                          new AdRequest.Builder().build();

                  RewardedAd.load(
                          this,
                          TEST_REWARDED_ID,
                          adRequest,
                          new RewardedAdLoadCallback() {

                              @Override
                              public void onAdLoaded(
                                      @NonNull RewardedAd ad) {

                                  rewardedAd = ad;

                                  rewardedAd.setFullScreenContentCallback(
                                          new FullScreenContentCallback() {

                                              @Override
                                              public void onAdDismissedFullScreenContent() {
                                                  rewardedAd = null;
                                                  loadRewardedAd();
                                              }

                                              @Override
                                              public void onAdFailedToShowFullScreenContent(
                                                      @NonNull AdError adError) {

                                                  rewardedAd = null;
                                                  loadRewardedAd();
                                              }
                                          }
                                  );
                              }

                              @Override
                              public void onAdFailedToLoad(
                                      @NonNull LoadAdError loadAdError) {

                                  rewardedAd = null;
                              }
                          }
                  );
              }

              public class AdBridge {

                  @JavascriptInterface
                  public void showRewarded() {

                      runOnUiThread(() -> {

                          if (rewardedAd != null) {

                              rewardedAd.show(
                                      MainActivity.this,
                                      rewardItem -> {

                                          webView.post(() -> {

                                              webView.evaluateJavascript(
                                                      "if(window.adMobRewardEarned){window.adMobRewardEarned();}",
                                                      null
                                              );

                                          });
                                      }
                              );

                          } else {
                              loadRewardedAd();
                          }
                      });
                  }
              }

              @Override
              protected void onDestroy() {

                  if (bannerAd != null) {
                      bannerAd.destroy();
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-Release-APK
          path: app/build/outputs/apk/**/*.apk
