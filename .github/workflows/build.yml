name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html

          # Fallback icon banaviye chhiye jethi resource missing ni error na aave
          cat > app/src/main/res/drawable/ic_launcher_fallback.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:pathData="M30,30h48v48h-48z"/>
          </vector>
          EOF

          # Jo icon.png hoy to copy thase, nahi to fallback icon set thase
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            cp app/src/main/res/drawable/ic_launcher_fallback.xml app/src/main/res/mipmap-mdpi/ic_launcher.xml
            cp app/src/main/res/drawable/ic_launcher_fallback.xml app/src/main/res/mipmap-hdpi/ic_launcher.xml
            cp app/src/main/res/drawable/ic_launcher_fallback.xml app/src/main/res/mipmap-xhdpi/ic_launcher.xml
            cp app/src/main/res/drawable/ic_launcher_fallback.xml app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
            cp app/src/main/res/drawable/ic_launcher_fallback.xml app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.watchtoearn.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName "1.3"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation "com.google.android.gms:play-services-ads:24.7.0"
              implementation "androidx.annotation:annotation:1.9.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-5150848800087406~5053767077" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.annotation.NonNull;

          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView bannerAd;
              private RewardedAd rewardedAd;
              private boolean isLoadingAd = false;

              private static final String BANNER_AD_UNIT_ID =
                      "ca-app-pub-3940256099942544/6300978111";

              // Google Official Rewarded Test ID (Fast & 100% Reliable Loading)
              private static final String REWARDED_AD_UNIT_ID =
                      "ca-app-pub-3940256099942544/5224354917";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("whatsapp:")
                                  || url.contains("api.whatsapp.com")
                                  || url.startsWith("intent:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  return false;
                              }
                          }
                          return false;
                      }
                  });

                  webView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  webView.loadUrl("file:///android_asset/index.html");

                  int bannerHeightPx = (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          50,
                          getResources().getDisplayMetrics()
                  );

                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  );
                  webParams.bottomMargin = bannerHeightPx;
                  root.addView(webView, webParams);

                  bannerAd = new AdView(this);
                  bannerAd.setAdSize(AdSize.BANNER);
                  bannerAd.setAdUnitId(BANNER_AD_UNIT_ID);

                  AdRequest bannerRequest = new AdRequest.Builder().build();
                  bannerAd.loadAd(bannerRequest);

                  FrameLayout.LayoutParams bannerParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  bannerParams.gravity = Gravity.BOTTOM;
                  root.addView(bannerAd, bannerParams);

                  setContentView(root);

                  MobileAds.initialize(this, initializationStatus -> {
                      loadRewardedAd();
                  });
              }

              private void loadRewardedAd() {
                  if (isLoadingAd) return;
                  isLoadingAd = true;

                  AdRequest request = new AdRequest.Builder().build();
                  RewardedAd.load(
                          this,
                          REWARDED_AD_UNIT_ID,
                          request,
                          new RewardedAdLoadCallback() {
                              @Override
                              public void onAdLoaded(@NonNull RewardedAd ad) {
                                  rewardedAd = ad;
                                  isLoadingAd = false;

                                  rewardedAd.setFullScreenContentCallback(
                                          new FullScreenContentCallback() {
                                              @Override
                                              public void onAdDismissedFullScreenContent() {
                                                  rewardedAd = null;
                                                  loadRewardedAd();
                                              }

                                              @Override
                                              public void onAdFailedToShowFullScreenContent(@NonNull AdError error) {
                                                  rewardedAd = null;
                                                  loadRewardedAd();
                                              }
                                          }
                                  );
                              }

                              @Override
                              public void onAdFailedToLoad(@NonNull LoadAdError error) {
                                  rewardedAd = null;
                                  isLoadingAd = false;
                              }
                          }
                  );
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (rewardedAd != null) {
                              rewardedAd.show(
                                      MainActivity.this,
                                      rewardItem -> triggerRewardInWeb()
                              );
                          } else {
                              Toast.makeText(
                                      MainActivity.this,
                                      "Loading ad... Please wait 3 seconds",
                                      Toast.LENGTH_SHORT
                              ).show();
                              loadRewardedAd();

                              // Fallback trigger so user never gets stuck
                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  if (rewardedAd != null) {
                                      rewardedAd.show(
                                              MainActivity.this,
                                              rewardItem -> triggerRewardInWeb()
                                      );
                                  } else {
                                      triggerRewardInWeb();
                                  }
                              }, 3500);
                          }
                      });
                  }
              }

              private void triggerRewardInWeb() {
                  if (webView != null) {
                      webView.post(() ->
                              webView.evaluateJavascript(
                                      "if(window.adMobRewardEarned){window.adMobRewardEarned();}",
                                      null
                              )
                      );
                  }
              }

              @Override
              protected void onDestroy() {
                  if (bannerAd != null) {
                      bannerAd.destroy();
                  }
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk
          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk
          ls -lh apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
          
