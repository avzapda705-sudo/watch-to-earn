name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            # Standard mipmap launcher icons
            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            # Adaptive foreground scaled to fit safe circle without cropping text
            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            # Background color matching image navy tone
            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.watchtoearn.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 17
                  versionName "2.6"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation "com.unity3d.ads:unity-ads:4.12.5"
              implementation "androidx.annotation:annotation:1.9.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;
          import com.unity3d.services.banners.BannerErrorInfo;
          import com.unity3d.services.banners.BannerView;
          import com.unity3d.services.banners.UnityBannerSize;

          public class MainActivity extends Activity {

              private WebView webView;
              private FrameLayout root;
              private BannerView bannerView;

              // Unity Ads credentials
              private static final String UNITY_GAME_ID = "500381847";
              private static final boolean TEST_MODE = false;

              private static final String REWARDED_PLACEMENT_ID = "BP_Rewarded_Android";
              private static final String INTERSTITIAL_PLACEMENT_ID = "BP_Interstitial_Android";
              private static final String BANNER_PLACEMENT_ID = "BP_Banner_Android";

              private boolean isRewardedLoaded = false;
              private boolean isInterstitialLoaded = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new FrameLayout(this);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("whatsapp:")
                                  || url.contains("api.whatsapp.com")
                                  || url.startsWith("intent:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  return false;
                              }
                          }
                          return false;
                      }
                  });

                  webView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  webView.loadUrl("file:///android_asset/index.html");

                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  );
                  root.addView(webView, webParams);

                  setContentView(root);

                  // Initialize Unity Ads
                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, TEST_MODE, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          loadRewardedAd();
                          loadInterstitialAd();
                          loadBannerAd();
                      }

                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                          // Retrying in 5 seconds
                          new Handler(Looper.getMainLooper()).postDelayed(() -> {
                              UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, TEST_MODE, this);
                          }, 5000);
                      }
                  });
              }

              private void loadRewardedAd() {
                  UnityAds.load(REWARDED_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          isRewardedLoaded = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          isRewardedLoaded = false;
                      }
                  });
              }

              private void loadInterstitialAd() {
                  UnityAds.load(INTERSTITIAL_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          isInterstitialLoaded = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          isInterstitialLoaded = false;
                      }
                  });
              }

              private void loadBannerAd() {
                  runOnUiThread(() -> {
                      if (bannerView != null) {
                          bannerView.destroy();
                      }
                      bannerView = new BannerView(MainActivity.this, BANNER_PLACEMENT_ID, new UnityBannerSize(320, 50));
                      bannerView.setListener(new BannerView.IListener() {
                          @Override
                          public void onBannerLoaded(BannerView bannerAdView) {}

                          @Override
                          public void onBannerClick(BannerView bannerAdView) {}

                          @Override
                          public void onBannerFailedToLoad(BannerView bannerAdView, BannerErrorInfo errorInfo) {}

                          @Override
                          public void onBannerLeftApplication(BannerView bannerAdView) {}
                      });

                      FrameLayout.LayoutParams bannerParams = new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      bannerParams.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                      root.addView(bannerView, bannerParams);
                      bannerView.load();
                  });
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (isRewardedLoaded) {
                              UnityAds.show(MainActivity.this, REWARDED_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      isRewardedLoaded = false;
                                      loadRewardedAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      isRewardedLoaded = false;
                                      loadRewardedAd();
                                      if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                          triggerRewardInWeb();
                                      }
                                  }
                              });
                          } else {
                              Toast.makeText(MainActivity.this, "Loading ad... Please wait 3 seconds", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();

                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  if (isRewardedLoaded) {
                                      showRewarded();
                                  } else {
                                      triggerRewardInWeb();
                                  }
                              }, 3500);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (isInterstitialLoaded) {
                              UnityAds.show(MainActivity.this, INTERSTITIAL_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      isInterstitialLoaded = false;
                                      loadInterstitialAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      isInterstitialLoaded = false;
                                      loadInterstitialAd();
                                  }
                              });
                          } else {
                              loadInterstitialAd();
                          }
                      });
                  }
              }

              private void triggerRewardInWeb() {
                  if (webView != null) {
                      webView.post(() ->
                              webView.evaluateJavascript(
                                      "if(window.adMobRewardEarned){window.adMobRewardEarned();}",
                                      null
                              )
                      );
                  }
              }

              @Override
              protected void onDestroy() {
                  if (bannerView != null) {
                      bannerView.destroy();
                  }
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
          
